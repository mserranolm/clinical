version = 0.1

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "clinical-backend"
region = "us-east-1"
profile = "aloai"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true

[pipeline.deploy.parameters]
stack_name = "clinical-backend"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
no_fail_on_empty_changeset = true
