AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Clinical backend serverless (Lambda + API Gateway + EventBridge + DynamoDB)

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 512
    Tags:
      product: clinisense
      Product: docco
      Environment: prod
      ManagedBy: sam-cloudformation
      Module: api
      AgentType: platform
    Environment:
      Variables:
        ENVIRONMENT: prod
        APPOINTMENT_TABLE: !Ref AppointmentsTable
        PATIENT_TABLE: !Ref PatientsTable
        CONSENT_TABLE: !Ref ConsentsTable
        CONSENT_TEMPLATE_TABLE: !Ref ConsentTemplatesTable
        ODONTOGRAM_TABLE: !Ref OdontogramsTable
        TREATMENT_PLAN_TABLE: !Ref TreatmentPlansTable
        USER_TABLE: !Ref UsersTable
        PAYMENT_TABLE: !Ref PaymentsTable
        BUDGET_TABLE: !Ref BudgetsTable
        PLATFORM_SETTINGS_TABLE: !Ref PlatformSettingsTable
        PLATFORM_ADMIN_EMAIL: mserranolm@gmail.com
        BOOTSTRAP_SECRET: ""
        SEND_SMS: "true"
        SEND_EMAIL: "true"
        USE_DYNAMODB: "true"
        CLINIC_TZ: America/Caracas
        SES_SENDER_EMAIL: no-reply@aloai.me
        FRONTEND_BASE_URL: https://docco.aloai.me
        IMAGES_BUCKET: !Sub "clinical-appointment-images-${AWS::AccountId}"
        BEDROCK_MODEL_ID: "amazon.nova-lite-v1:0"
        DOCCO_ENABLED: "true"
        SMTP_HOST: email-smtp.us-east-1.amazonaws.com
        SMTP_PORT: "587"
        SMTP_USER: AKIA53MYETRACFNKDPPF
        SMTP_PASS: "{{resolve:ssm:/clinical/smtp_pass}}"
        WHATSAPP_ENABLED: "true"
        WHATSAPP_CONFIG_TABLE: !Ref WhatsAppConfigTable
        EVOLUTION_API_URL: "{{resolve:ssm:/clinical/evolution-api-url}}"
        EVOLUTION_API_KEY: "{{resolve:secretsmanager:clinical/evolution/api-key}}"
        WHATSAPP_MODEL_ID: "us.anthropic.claude-sonnet-4-6"
        WHATSAPP_HAIKU_MODEL_ID: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
        WHATSAPP_SONNET_MODEL_ID: "us.anthropic.claude-sonnet-4-6"
        WHATSAPP_QUEUE_URL: !Ref WhatsAppMessagesQueue
        API_GATEWAY_URL: "{{resolve:ssm:/clinical/api-gateway-url}}"

Resources:
  # API Gateway REST API (para API Keys)
  ClinicalRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      Description: Clinical REST API with API Key authentication
      StageName: prod
      Tags:
        product: clinisense
        Product: docco
        Module: api
        AgentType: platform
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,x-api-key'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      Auth:
        ApiKeyRequired: true

  # GatewayResponses: añadir CORS headers a errores que API Gateway devuelve antes de llegar a Lambda
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ClinicalRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ClinicalRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  GatewayResponseInvalidApiKey:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ClinicalRestApi
      ResponseType: INVALID_API_KEY
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  GatewayResponseAccessDenied:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ClinicalRestApi
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  GatewayResponseUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ClinicalRestApi
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  # API Key para autenticación del frontend
  ClinicalApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "${AWS::StackName}-api-key"
      Description: API Key for Clinical frontend
      Enabled: true
      Tags:
        - Key: product
          Value: clinisense

  # Usage Plan con límite de llamadas diarias
  ClinicalUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
      Description: Clinical API usage plan - 50000 requests per day
      Throttle:
        RateLimit: 100
        BurstLimit: 500
      Quota:
        Limit: 50000
        Period: DAY
      Tags:
        - Key: product
          Value: clinisense

  # Asociar API Key con Usage Plan
  ClinicalUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KeyId: !Ref ClinicalApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ClinicalUsagePlan

  ClinicalApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConsentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConsentTemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OdontogramsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TreatmentPlansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BudgetsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlatformSettingsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::clinical-appointment-images-${AWS::AccountId}/*"
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/aloai.me"
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:CreateTable
                - dynamodb:DescribeTable
                - dynamodb:ListTables
                - dynamodb:TagResource
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:aws:bedrock:us:${AWS::AccountId}:inference-profile/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref WhatsAppConfigTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WhatsAppMessagesQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:clinical/evolution/*"
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clinical/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ClinicalRestApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              ApiKeyRequired: true
        WhatsAppWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ClinicalRestApi
            Path: /public/whatsapp/webhook
            Method: POST
            Auth:
              ApiKeyRequired: false

  Reminder24hFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Tags:
        Module: scheduler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConsentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlatformSettingsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/aloai.me"
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
      Events:
        Every15Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Name: clinical-24h-reminder

  EndOfDayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Tags:
        Module: scheduler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConsentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlatformSettingsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/aloai.me"
      Events:
        DailyClose:
          Type: Schedule
          Properties:
            Schedule: cron(0 22 * * ? *)
            Name: clinical-end-day-reminder

  WhatsAppWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Timeout: 120
      MemorySize: 512
      Tags:
        Module: whatsapp
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WhatsAppConfigTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:aws:bedrock:us:${AWS::AccountId}:inference-profile/*"
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:clinical/evolution/*"
        - SQSPollerPolicy:
            QueueName: !GetAtt WhatsAppMessagesQueue.QueueName
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt WhatsAppMessagesQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  WhatsAppMessagesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: clinical-whatsapp-messages-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: product
          Value: clinisense

  WhatsAppMessagesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: clinical-whatsapp-messages
      VisibilityTimeout: 180
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WhatsAppMessagesDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: product
          Value: clinisense

  PlatformSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-platform-settings
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-appointments
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-patients
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  ConsentTemplatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-consent-templates
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  ConsentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-consents
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  OdontogramsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-odontograms
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  TreatmentPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-treatment-plans
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-users
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-payments
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  BudgetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-budgets
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

  WhatsAppConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: clinical-whatsapp-config
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: product
          Value: clinisense

Outputs:
  ApiUrl:
    Description: REST API endpoint with API Key authentication
    Value: !Sub https://${ClinicalRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  ApiKey:
    Description: API Key for frontend authentication
    Value: !Ref ClinicalApiKey
    Export:
      Name: !Sub ${AWS::StackName}-ApiKey

  ApiKeyId:
    Description: API Key ID for retrieving the actual key value
    Value: !Ref ClinicalApiKey
    Export:
      Name: !Sub ${AWS::StackName}-ApiKeyId

  UsagePlanId:
    Description: Usage Plan ID (100 requests per day)
    Value: !Ref ClinicalUsagePlan
    Export:
      Name: !Sub ${AWS::StackName}-UsagePlanId

  WhatsAppQueueUrl:
    Description: SQS Queue URL for WhatsApp messages
    Value: !Ref WhatsAppMessagesQueue
    Export:
      Name: !Sub ${AWS::StackName}-WhatsAppQueueUrl
